[project]
name = "ebaymcpserver"
version = "0.1.0"
description = "eBay auction search MCP server — supports stdio (CLI) and HTTP (Claude.ai plugin) transports"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.3.0",
    "pydantic",
    "requests>=2.28.0",
    "starlette>=0.27.0",
    "uvicorn>=0.24.0",
]

[project.scripts]
ebay-mcp = "ebay-mcp.server:main"
ebay-mcp-http = "ebay-mcp.server_http:main"
